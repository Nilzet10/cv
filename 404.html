<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Nidha's Events</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,700&display=swap" rel="stylesheet">
  <style>
    :root { --cream: #FBF6EE; --paper: #FFFDF9; --ink: #2E1C12; --muted: #6F5A4C; --henna: #8E3F17; --henna-deep: #6E2F10; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
      font-family: "DM Sans", system-ui, sans-serif; color: var(--ink); text-align: center;
      background: radial-gradient(600px 400px at 50% 30%, rgba(199,154,62,.16), transparent 70%), var(--cream);
    }
    main { max-width: 460px; }
    img { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
    p.kicker { font-size: .78rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--henna); margin: 0 0 10px; }
    h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: clamp(2.4rem, 8vw, 3.4rem); line-height: 1.05; margin: 0 0 14px; }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0 0 28px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.btn { display: inline-flex; align-items: center; justify-content: center; padding: .9em 1.45em; border-radius: 999px; font-weight: 700; text-decoration: none; border: 1.5px solid transparent; }
    a.primary { background: var(--henna); color: #fff; }
    a.primary:hover { background: var(--henna-deep); }
    a.ghost { border-color: var(--ink); color: var(--ink); }
    a:focus-visible { outline: 3px solid var(--henna-deep); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="">
    <p class="kicker">Page not found</p>
    <h1>This page isn't here</h1>
    <p>The link may be old or mistyped. Everything for henna, the tea cart and the DJ is on the home page.</p>
    <div class="row">
      <a class="btn primary" href="/">Go to the home page</a>
      <a class="btn ghost" href="/#check">Check your date</a>
    </div>
  </main>
</body>
</html>
